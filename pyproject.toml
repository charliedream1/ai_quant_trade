# File format: TOML; encoding: UTF-8
[project]
name = "b001-all-in-one"
version = "0.1.0"
description = "AI driven all-in-one quant trading platform backend"
readme = "docs/platform/index.md"
requires-python = ">=3.10.1,<3.15"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "loguru==0.7.3",
    "pydantic==2.14.0",
    "pyyaml==6.0.3",
    "tzdata==2026.2",
    "python-dotenv==1.2.2",
    "apscheduler==3.11.3",
    "python-multipart==0.0.31",
    "gradio==6.16.0",
    "huggingface-hub==1.33.0",
    "mkdocs==1.6.1",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "duckdb==1.5.6",
    "openpyxl==3.1.5",
    "plotly==6.6.0",
    "Jinja2==3.1.6",
    "requests==2.33.1",
    "json-repair==0.60.1",
    "pypdf==6.21.4",
    "pillow==12.3.0",
    "urllib3==2.8.0",
    "python-docx==1.2.0",
    "markitdown[docx]==0.1.9",
    "akshare==1.18.83",
    "baostock==0.9.3",
    "openai==2.43.0",
    "filelock==3.32.3; python_version < '3.11'",
    "filelock==4.2.4; python_version >= '3.11'",
    "tomli==2.2.1; python_version < '3.11'",
]

[project.scripts]
aiquant = "src.cli.app:main"

[project.optional-dependencies]
llm = ["litellm==1.101.3; python_version < '3.11'", "litellm==1.100.5; python_version >= '3.11'", "httpx==0.28.1"]
models = [
    "numpy==2.2.6; python_version < '3.11'",
    "numpy==2.4.6; python_version >= '3.11'",
    "scipy==1.15.3; python_version < '3.11'",
    "scipy==1.17.0; python_version >= '3.11'",
    "scikit-learn==1.7.2; python_version < '3.11'",
    "scikit-learn==1.8.0; python_version >= '3.11'",
    "lightgbm==4.6.0",
    "xgboost==3.1.3",
    "torch==2.13.0",
]
tdx = ["mootdx==0.11.7"]
observability = ["langfuse==4.17.0"]
channels = ["lark-oapi==1.7.5", "websocket-client==1.9.2", "qrcode==8.2", "pycryptodome==4.3.0", "requests-toolbelt==1.0.0", "websockets==15.0.1"]
dev = [
    "playwright==1.59.0",
    "bandit==1.9.4",
    "pip==25.0.1",
    "setuptools==84.1.0",
    "wheel==0.46.2",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.15",
    "mypy==1.20.2",
    "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.uv]
# The base OpenAI SDK accepts both profile versions. The LiteLLM profile fixes
# HTTPX at 0.28.1 while the legacy mootdx profile resolves its own 0.25.x copy.
# Keep those profiles in separate environments.
conflicts = [[{ extra = "llm" }, { extra = "tdx" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.format]
# Gradio regenerates this interface on import; handwritten implementation remains checked.
exclude = ["src/frontend/components/strategy_graph/__init__.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
mypy_path = "src/typing_stubs"
exclude = ['^src/typing_stubs/']
warn_unused_configs = false

[[tool.mypy.overrides]]
module = [
    "baostock",
    "baostock.*",
    "duckdb",
    "duckdb.*",
    "gradio",
    "gradio.*",
    "mootdx",
    "mootdx.*",
    "openpyxl",
    "openpyxl.*",
    "pandas",
    "pandas.*",
    "plotly",
    "plotly.*",
    "pyarrow",
    "pyarrow.*",
    "requests",
    "requests.*",
    "yaml",
    "yaml.*",
    "lightgbm",
    "lightgbm.*",
    "xgboost",
    "xgboost.*",
]
ignore_missing_imports = true

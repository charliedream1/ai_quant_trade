title = "AIQuant all-in-one secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Generated Python caches and the fixed archived screenshot location."
paths = [
    '''(^|[\\/])\.mypy_cache[\\/]''',
    '''(^|[\\/])\.pytest_cache[\\/]''',
    '''(^|[\\/])\.ruff_cache[\\/]''',
    '''(^|[\\/])__pycache__[\\/]''',
    '''(^|[\\/])docs[\\/]audit[\\/]screenshots[\\/]''',
]

[[allowlists]]
description = "SHA-256 evidence checksums, scoped to the two fixed factor manifests."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''(^|[\\/])docs[\\/]audit[\\/]factor_research_2026-10-24[\\/](evidence|evidence-optimized)[\\/]manifest\.json$''']
regexes = ['''^[a-f0-9]{64}$''']

[[allowlists]]
description = "Public JWT vulnerability examples in archived pip-audit advisory descriptions."
targetRules = ["jwt"]
condition = "AND"
regexTarget = "line"
paths = [
    '''(^|[\\/])docs[\\/]audit[\\/]composition_2026-10-22[\\/]dependencies\.json$''',
    '''(^|[\\/])docs[\\/]audit[\\/]factor_research_2026-10-24[\\/](evidence|evidence-optimized)[\\/]checks[\\/]dependency-audit\.json$''',
    '''(^|[\\/])docs[\\/]audit[\\/]insight_dependency_audit_2026-10-22\.json$''',
]
regexes = ['''"id"\s*:\s*"(PYSEC-2026-2528|GHSA-pxh4-856f-4h89)"''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Allow Hugging Face model and tokenizer identifiers"
regexTarget = "match"
regexes = [
    "(model|tokenizer)\\s*=\\s*[\"'][A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+[\"']",
]

# gitleaks 配置：https://github.com/gitleaks/gitleaks
# 对已知误报（HuggingFace 模型名 Org/Repo 格式）添加 allowlist

title = "gitleaks config"

[extend]
useDefault = true

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Allow Hugging Face model and tokenizer identifiers"
regexTarget = "match"
regexes = [
    "(model|tokenizer)\\s*=\\s*[\"'][A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+[\"']",
]

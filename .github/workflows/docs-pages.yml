# MkDocs 文档站自动部署到 GitHub Pages
# 当 master 分支的文档相关文件变更时，自动构建并发布
#
# 首次使用需在 GitHub 仓库 Settings → Pages → Source 选择 "GitHub Actions"
# 详见：docs/发布操作指南.md
name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - 'zz_scripts/docs_hook.py'
      - 'zz_scripts/gen_project_wrappers.py'
      - 'egs_*/**'
      - 'egs_skill/**/*.md'
      - 'ai_notes/**/*.md'
      - 'README.md'
      - 'README_ZH.md'
      - 'README_JA.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/workflows/docs-pages.yml'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装 MkDocs Material 及依赖
        run: |
          pip install --no-cache-dir \
            "mkdocs>=1.6" \
            "mkdocs-material>=9.5" \
            "mkdocs-material-extensions>=1.3" \
            "mkdocs-include-markdown-plugin>=4.0" \
            "pymdown-extensions>=10.7"

      # 先跑 wrapper 生成器：核对所有 egs_*/README.md、ai_notes/*.md、
      # egs_skill/*.md 源文件都存在并生成最新的 docs/_projects/<cat>/<slug>.md。
      # 若任一源文件被改名 / 删掉 / 移动，本步会以 SystemExit(1) + MISSING 列表
      # 失败，不会进入 mkdocs 构建，避免页面上残留字面 `{% include ... %}`。
      - name: 同步生成 egs 包装页并校验源文件
        run: python zz_scripts/gen_project_wrappers.py

      # 发布前静态检查：mkdocs.yml 语法 / nav 路径存在 / include 引用能解析 /
      # 自动维护标记成对 / 首页中英文切换 / 静态资源都已登记。
      # 任何一项失败都会 exit 1 并列出原因，避免 mkdocs build 半成品部署。
      - name: mkdocs 发布前静态检查
        run: python zz_scripts/check_docs_build.py

      - name: 构建文档站
        # 注：不开 --strict，因为部分 egs_*/README.md 自带指向 egs_local
        # （docs/ 之外）图片的相对链接（如 img/*.png、.README_images/*.png），
        # 这些不在 mkdocs 文件集合里，--strict 会把它们当成 broken link 报错，
        # 导致整个站无法发布。改用以下两道闸门拦截真正危险的失效：
        #   1. 上一条 gen_project_wrappers.py 校验 59 个源 README 都存在
        #   2. mkdocs-include-markdown-plugin 找不到 include 文件时抛
        #      PluginError → BuildError（与 --strict 无关，会立即中止构建）
        # egs_local 图片链接会在 wrapper 页面以 warning 形式列出，不阻断构建；
        # 如需修，可逐项把 egs 内的图片复制/迁移到 docs/ 对应目录。
        run: mkdocs build --clean

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

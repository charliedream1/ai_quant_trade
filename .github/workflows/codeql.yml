# CodeQL 安全与质量扫描
# 文档: https://docs.github.com/zh/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/customizing-code-scanning
name: "CodeQL"

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # 周一 06:17 UTC 周期扫描，避开高峰期
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

# 同一时间只允许一个 CodeQL 任务运行
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 初始化 CodeQL 工具链
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-and-quality 同时启用安全与质量规则集
          queries: security-and-quality
          # 排除非项目核心代码，减少误报与扫描时间
          paths-ignore: |
            '**/zz_venv/**'
            '**/__pycache__/**'
            '**/*.egg-info/**'
            '**/.ipynb_checkpoints/**'
            'zz_scripts/**'
            'a_全网优秀资源/**'
            'egs_online_platform/聚宽_JoinQuant/01_模板使用说明/**'

      # 依赖自动安装：让 CodeQL 在 Python 项目上能解析 import
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

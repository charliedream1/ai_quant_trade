# MkDocs documentation site configuration
# Source scope: only maintained documentation under docs/ is published.
# Multilingual model:
# - Chinese is the default source language: docs/foo.md
# - English translations live beside the source files: docs/foo.en.md
# - mkdocs-static-i18n builds a static bilingual site and provides the
#   Material language selector. No runtime translation API is used.

site_name: AI 量化交易操盘手
site_url: https://charliedream1.github.io/ai_quant_trade/
site_description: 一站式 AI 量化交易平台，从学习、模拟到实盘
site_author: charliedream1
repo_url: https://github.com/charliedream1/ai_quant_trade
repo_name: charliedream1/ai_quant_trade
edit_uri: edit/master/docs/

docs_dir: docs
site_dir: site

exclude_docs: |
  intro.md
  snippets/**

copyright: Copyright &copy; 2026 charliedream1 · Apache-2.0 License

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list
  - footnotes

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/site.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/charliedream1/ai_quant_trade

plugins:
  - search:
      lang:
        - zh
        - en
  - tags
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
          site_name: AI 量化交易操盘手
          site_description: 一站式 AI 量化交易平台，从学习、模拟到实盘
          theme:
            language: zh
        - locale: en
          name: English
          build: true
          site_name: AI Quant Trader
          site_description: One-stop AI quantitative trading platform, from learning and simulation to live trading
          theme:
            language: en
          nav_translations:
            首页: Home
            环境配置: Environment
            GPU 环境配置: GPU Environment
            GPU 配置 (Windows): GPU Setup (Windows)
            Python 环境配置: Python Environment
            Conda 安装: Conda Install
            Conda 国内源配置: Conda Mirrors
            Miniconda 安装: Miniconda Install
            常见问题: FAQ
            Python 包依赖问题: Python Dependencies
            GitHub 问题: GitHub Issues
            numpy 版本问题: numpy Version Issues
            星球使用: Community
            星球介绍: Community Overview
            新人使用指南: New User Guide
            部署运维: Deployment
            发布操作指南: Publishing Guide
            Cloudflare Pages 部署: Cloudflare Pages

nav:
  - 首页: index.md
  - 环境配置:
      - GPU 环境配置: 01_环境配置/01_GPU环境配置/README.md
      - GPU 配置 (Windows): 01_环境配置/01_GPU环境配置/01_Win下GPU配置.md
      - Python 环境配置: 01_环境配置/02_python环境配置/README.md
      - Conda 安装: 01_环境配置/02_python环境配置/01_conda安装.md
      - Conda 国内源配置: 01_环境配置/02_python环境配置/02_conda配置国内源.md
      - Miniconda 安装: 01_环境配置/02_python环境配置/03_mini_conda安装.md
  - 常见问题:
      - Python 包依赖问题: 02_常见问题/01_python包依赖问题/README.md
      - GitHub 问题: 02_常见问题/02_Github问题.md
      - numpy 版本问题: 02_常见问题/03_numpy_version_issue.md
  - 星球使用:
      - 星球介绍: 03_星球使用和介绍/01_星球介绍.md
      - 新人使用指南: 03_星球使用和介绍/02_新人使用指南.md
  - 部署运维:
      - 发布操作指南: 04_website_deployment/发布操作指南.md
      - Cloudflare Pages 部署: 04_website_deployment/Cloudflare_Pages_部署指南.md

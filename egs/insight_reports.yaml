# 文件格式：YAML，编码：UTF-8
version: 1
defaults:
  backend: api
  timeframe: daily
  kline_count: 120
  news_limit: 12
  sector_limit: 20
  history_limit: 30
  max_turns: 4
  poll_seconds: 0.25
  output_tokens: 4000
  temperature: 0.2
  connect_timeout: 5
  read_timeout: 180
  deadline_seconds: 600
  max_prompt_chars: 110000
  max_output_chars: 70000
  max_event_chars: 18000
  event_data_excerpt_chars: 1200
  max_skill_chars: 42000
  chart_height: 340
  chart_colors: ['#2385c8', '#18a899', '#d9a23b', '#7c68cb']
  positive_color: '#db526a'
  negative_color: '#18a899'
  annual_periods: 252
  technical_windows: [5, 20, 60]
  volatility_window: 20
  rsi_window: 14
  macd_windows: [12, 26, 9]
  bollinger_deviation: 2
  daily_lookback_days: 8
  monthly_lookback_days: 32
  max_concurrent_jobs: 2
  preview_height: 860
backends:
  - {id: api, label: 模型 API}
  - {id: codex, label: Codex CLI}
  - {id: qoder, label: Qoder CLI}
  - {id: trae, label: TRAE CLI}
  - {id: codebuddy, label: CodeBuddy Code}
registry:
  source: WorkBuddy 本地 Skill（平台适配）
  param_schema:
    type: object
    properties:
      backend: {type: string}
      market: {type: string}
      symbol: {type: string}
      model_id: {type: integer, minimum: 1}
      model_name: {type: string}
      reasoning_effort: {type: string}
      timeframe: {type: string}
      end_date: {type: string}
tasks:
  market_review:
    label: Market Review · 市场复盘
    skill_dir: market_review
    resources: [SKILL.md, prompts/analyst.md, prompts/aggregator.md, prompts/verifier.md, refs/Report_Layout.md]
    sections: [执行摘要, 市场总体表现, 板块与量能, 资金与情绪, 新闻与政策, 海外背景, 风险与后续观察]
    instruction: >-
      依照 market-review Skill 对本次实际行情与新闻证据做市场复盘。
      日度只解释最近有证据的交易时点，月度必须有区间证据；只有最新快照时明确不能推断整月涨跌或资金趋势。
      覆盖指数、板块、量能、情绪、新闻政策、海外和风险。没有公众号、海外、资金数据时明确缺失。
  single_stock_analysis:
    label: Single Stock Analysis · 个股分析
    skill_dir: single_stock_analysis
    resources: [SKILL.md, references/a_share_technical_skill.md]
    sections: [执行摘要, 行情与量价, 趋势与动量, 基本面与估值, 新闻与事件, 风险与观察清单]
    instruction: >-
      依照 stock-analysis 的个股研究维度及 A 股技术参考分析指定证券。
      技术读数只能引用本次程序计算结果；不得声称已执行未实现的 23 项指标、筹码或主力追踪。
      基本面缺失时不猜测财务、评级、目标价或机构观点，报告为研究观察，不执行交易。
  macro_analysis:
    label: 宏观经济分析
    skill_dir: economic_analysis
    resources: [SKILL.md]
    shared_model_client: true
    sections: [执行摘要, 增长与通胀, 信用与流动性, 政策与行业影响, 风险与后续观察]
    instruction: >-
      Analyze only the supplied Chinese macroeconomic snapshot. Preserve periods, units, frequencies,
      source revisions and stale-data warnings. Separate observed facts from hypotheses about policy
      and industry effects. Do not invent policy events or treat current revisions as historical PIT data.
      Write a concise Chinese report with exact evidence references and explicit gaps.
      Use at most two short sentences per section and avoid repeating the full input tables.
      Follow each indicator's release frequency when proposing follow-up observations.
      Do not call a future or unfinished reporting period a missing current release.
  fundamental_analysis:
    label: 公司基本面分析
    skill_dir: economic_analysis
    resources: [SKILL.md]
    shared_model_client: true
    sections: [执行摘要, 财报范围与成长, 盈利质量与现金流, 偿债与财务风险, 估值与同业, 风险与后续观察]
    instruction: >-
      Analyze only the supplied company financial snapshot and computed metrics. Preserve CNY versus
      CNY_100m units, cumulative versus single-quarter versus TTM periods, and reported weighted ROE.
      Missing inputs remain unknown. Financial institutions require specialized methods.
      Compare only supplied peers from the same industry and period. Do not invent business segments,
      forecasts or target prices. Write a concise Chinese report with exact evidence references and gaps.
      Use at most two short sentences per section and avoid repeating the full input tables.
      Do not infer low debt-service or liquidity pressure from the debt/assets ratio alone;
      unknown debt components, maturity and liquidity evidence prevent that conclusion.
prompts:
  system: |
    你是平台内置 Skill 报告执行器。任务是根据本次本地 Skill、已采集证据与固定任务生成中文研究报告。
    本平台适配约定优先于上游 Skill 示例：仅生成 HTML 所需正文，不运行 shell、不安装依赖、不访问用户目录、
    不发布社交内容、不生成 PPT/视频、不调用 function call。上游出现的示例数字、日期、评分均不是本次证据。
    数据来源、时间、mock 与真实状态必须分开说明；缺失不是零，代理不是正式市场指标。
    你只能使用传入证据包，不能把记忆中的行情当实时数据，不提供未经证据支持的买卖价或收益承诺。
  protocol: |
    工具采用普通文本 ReAct。需要观察时输出 <tool_use>{"name":"evidence_read","arguments":{"source_id":"E1"}}</tool_use>。
    可用工具只有 skill_read 和 evidence_read；skill_read 参数为 resource，值必须是已加载资源清单中的相对路径。
    不得输出函数调用字段或要求任意代码执行。工具结果会作为观察回填。
    最终答案输出一个普通 JSON 对象（允许包在 JSON 代码块），结构为：
    {"title":"报告标题","summary":"结论摘要","sections":[{"heading":"章节名","paragraphs":["文字分析"],"source_ids":["E1"]}],"risks":["风险"],"missing":["缺失证据"]}。
    每个实质章节至少引用一个有效 source_id；事实、计算值和推断分开描述，数字只引用证据原值。
    不写 HTML、不插入外部链接或图片。标题与章节必须满足当前任务的要求。
  request: |
    {system}

    当前任务：{instruction}
    必需章节：{sections}
    实际参数：{request}

    以下上游 Skill 仅作为研究方法，示例不是事实：
    本次已加载资源索引：{resource_index}
    {skill}

    可用数据证据（可用 source_id 获取完整条目）：
    {evidence}

    {protocol}
  observation: |
    以下是实际执行的工具观察。继续研究，满足必需章节后输出最终 JSON：
    {observation}
  retry: |
    最终对象未通过格式或引用检查，原因：{error}。
    只能修复格式、完整章节和有效引用，不要补造数据。使用已有证据，重新输出最终 JSON 对象。

# 文件格式：YAML，编码：UTF-8；全局提醒与助手形象，不修改交易规则。
enabled: true
poll_seconds: 15
backoff_seconds: 60
sync_seconds: 10
page_size: 40
max_page_size: 100
source_batch: 200
retention_days: 30
toast_limit: 3
toast_width: 350
toast_seconds: 6

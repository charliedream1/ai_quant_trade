  error: warning
  high: warning
  warning: warning
  info: info
  success: success
completed: [completed, finished, success, 成功, 完成, 已完成]
failed: [failed, error, timeout, 失败, 超时]
partial: [partial, 部分完成]
source_targets:
  factor: {module: strategy, view: factors}
  system: {module: admin, view: settings}
  backtest: {module: simulation, view: backtest}
  job: {module: admin, view: jobs}
  report: {module: knowledge, view: reports}
sources: {backtest: 回测, job: 定时任务, alpha: Alpha研究, agent: Agent策略, report: AI报告}

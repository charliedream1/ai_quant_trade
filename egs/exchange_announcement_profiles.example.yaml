  bse_vocational:
    label: 北交所公告
    description: 北京证券交易所公告入口，按休市安排关键词筛选。
    announcement_index_urls:
      - https://www.bse.cn/disclosure/vocational.html
    announcement_link_keywords:
      - 休市安排
      - 部分节假日休市安排
    announcement_discovery_limit: 5

# File format: YAML; encoding: UTF-8
# Only explicitly listed transient callbacks use cancellable worker processes.
max_documents: 512
lifetime_payload_bytes: 256
max_pending_reads: 32
event_prefix_chars: 512
max_revision: 2147483647
idle_seconds: 90
retention_seconds: 1800
sweep_seconds: 10
heartbeat_seconds: 20
workers: 4
# Preserve same-process snapshot reuse across the four homepage presentations.
affinity_groups:
  - [home_account, home_market, home_news, home_operations]
poll_seconds: 0.05
read_deadline_seconds: 180
worker_error_chars: 500
shutdown_seconds: 3
messages:
  cancelled: Previous loading was cancelled when you left this page. Refresh or retry to load data.
share_methods: [home_market, home_news, market_overview, news, economic_load]
source_methods: [graph_local, graph_read, graph_search, graph_resolve]
read_methods:
  - home_account
  - home_market
  - home_news
  - home_operations
  - dashboard_account
  - dashboard_market
  - dashboard_strategy
  - dashboard_trade_history

默认保留模型生成关键词、递归调用 zvec-grep 的原方案。SAG 为可选后端，需先在本机配置并同步。单文档问答只检索所选原文；未配置 JEV 时可用 embedding 或 rerank。回答显示实际检索方式及降级原因。: Model-guided recursive zvec-grep search remains available. Configure and sync the optional SAG backend locally. Document questions search only the selected source. Embeddings or reranking can replace JEV; answers show the actual retrieval method and fallback reasons.
量化学习空间: Quantitative Learning Space
从概念到可核对的研究。课程无需模型或行情调用；教学数字均为明确标注的合成示例。: From concepts to inspectable research. Lessons need no model or market requests; all teaching examples use explicitly synthetic numbers.

风险雷达: Risk Radar
暂无账户风险数据: No account risk data
越靠外风险占用越高，各轴分别比较，参考线不触发交易。: Higher values indicate higher risk utilization. Compare axes separately; reference lines do not trigger trades.
仓位暴露为持仓市值占总资产比例；单票集中度为最大单票市值占总资产比例；快照回撤来自已保存账户快照。单位为百分比，缺失项不补零。面积不是统一风险分，快照回撤不等于完整历史最大回撤。: Exposure is position market value divided by assets; concentration is the largest position's share of assets. Snapshot drawdown uses saved snapshots. Values are percentages; missing values remain unavailable. Radar area is not a unified score, and snapshot drawdown is not a complete historical maximum drawdown.
指数动量: Index Momentum
板块广度: Sector Breadth
板块一致性: Sector Consistency
市场情绪雷达 · 代理指标: Market Sentiment Radar · Proxy Indicators
综合指数动量、板块广度与一致性，不代表买卖信号: Index momentum, sector breadth and consistency; not a trading signal
这是市场情绪代理评分，分数不代表上涨概率。: This is a market sentiment proxy score, not a probability of gains.
指数动量由指数平均涨跌幅映射到0—100；板块广度为当前板块样本中上涨的比例；一致性由板块涨跌幅极差映射。样本是当前数据源返回的指数和板块，不保证覆盖全市场。各轴含义不同，面积不能直接解释为综合情绪总分。: Index momentum maps average index changes onto 0–100; breadth is the rising share of the returned sector sample; consistency uses its return range. The provider sample may not cover the whole market. Axes have different meanings; radar area is not a total sentiment score.
颜色表示涨跌方向，面积或柱长的含义以图例和单位为准。: Color indicates price direction. Interpret area and bar length using the legend and units.
当前仅包含查询返回的板块样本。热力图面积通常表示成交额，缺失时可能采用等面积；不应将面积理解为收益。核对板块名称、涨跌幅、成交额与更新时间。: Only returned sectors are included. Heatmap area usually represents turnover, or equal areas when unavailable; it does not represent returns. Check sector names, changes, turnover and update times.
暂无有效持仓估值；不代表今日盈亏为零。: Position valuations are unavailable; this does not mean daily PnL is zero.
正负方向表示盈亏，请区分浮动盈亏、当日盈亏和已实现盈亏。: Distinguish unrealized, daily and realized PnL; signs indicate gains or losses.
持仓图使用当前市值与持仓成本计算浮动盈亏；交易图来自回测实际成交记录。颜色随项目盈亏配色，不能只看颜色判断方向；是否计费用及统计单位见结果明细。: Position charts compare market value with cost; trade charts use actual backtest fills. Check signs, fees and units in the results instead of relying on color alone.

# 文件格式：YAML，编码：UTF-8
default:
  short: 悬停查看数值，展开说明核对数据范围与单位。
  detail: 图表只展示当前查询返回的数据。请结合横纵轴、图例、数据源和观察时间阅读；缺失数据不代表零值，统计关联不代表买卖信号。
charts:
  risk:
    labels: [账户风险雷达, 风险雷达]
    short: 越靠外风险占用越高，各轴分别比较，参考线不触发交易。
    detail: 仓位暴露为持仓市值占总资产比例；单票集中度为最大单票市值占总资产比例；快照回撤来自已保存账户快照。单位为百分比，缺失项不补零。面积不是统一风险分，快照回撤不等于完整历史最大回撤。
  sentiment:
    labels: [市场情绪雷达]
    short: 这是市场情绪代理评分，分数不代表上涨概率。
    detail: 指数动量由指数平均涨跌幅映射到0—100；板块广度为当前板块样本中上涨的比例；一致性由板块涨跌幅极差映射。样本是当前数据源返回的指数和板块，不保证覆盖全市场。各轴含义不同，面积不能直接解释为综合情绪总分。
  nav:
    labels: [账户净值, 净值与回撤, 模拟账户净值, 净值曲线, 账户净值曲线]
    short: 向上表示净值增加，回撤表示相对此前高点的跌幅。
    detail: 对照策略与基准的日期范围、资金、费用和复权口径。回测曲线不等于实盘绩效，账户曲线只包含已保存快照。当前期间、数据源和执行费用见结果明细；没有曲线产物时不补造曲线。
  allocation:
    labels: [资产配置, 资产分布, 资产构成, 现金与持仓, 资金配置]
    short: 扇区大小表示资金金额占比，不表示收益或预测概率。
    detail: 查看现金与各项持仓市值占账户资产的比例。金额与占比以悬停提示和账户快照时间为准，缺少实盘回传时不能推断真实资产。
  pnl:
    labels: [持仓浮动盈亏, 交易盈亏分布, 交易分析, 标的盈亏归因]
    short: 正负方向表示盈亏，请区分浮动盈亏、当日盈亏和已实现盈亏。
    detail: 持仓图使用当前市值与持仓成本计算浮动盈亏；交易图来自回测实际成交记录。颜色随项目盈亏配色，不能只看颜色判断方向；是否计费用及统计单位见结果明细。
  sectors:
    labels: [板块样本热力图, 行业板块, 指数与板块, 板块行情, 板块热力, 板块表现, 板块涨跌, 市场背景]
    short: 颜色表示涨跌方向，面积或柱长的含义以图例和单位为准。
    detail: 当前仅包含查询返回的板块样本。热力图面积通常表示成交额，缺失时可能采用等面积；不应将面积理解为收益。核对板块名称、涨跌幅、成交额与更新时间。
  ic:
    labels: [RankIC, 因子IC, IC时序]
    short: 正值表示该股票池中因子排序与后续收益排序同向。
    detail: 横轴为因子观察日，纵轴为跨证券Spearman秩相关，范围-1至1。只有已到期前瞻收益参与计算；样本少或股票池改变时结果可能大幅变化。ICIR是历史RankIC均值除以总体标准差，监控页不年化。
  quantile:
    labels: [分位收益, 分层收益时序, 候选分层收益]
    short: 比较因子从低到高各组的后续收益；先看每组样本数量。
    detail: Q1为低因子组，末组为高因子组。组数随有效样本与最小组内数量减少，样本不足不强行分五组。收益是观察日之后指定周期的平均收盘价收益，未计费用与融券限制；多空价差为最高组减最低组，不是真实交易收益。
  factor_diagnostic:
    labels: [因子诊断, 候选因子诊断]
    short: 不同前瞻周期比较预测效果，均值与波动共同观察稳定性。
    detail: IC衰减图按配置周期显示历史平均RankIC。稳定性图比较RankIC均值与标准差；相邻前瞻收益可能重叠，不能视为完全独立样本。换手和容量为代理或未评估状态，不能理解为真实可成交容量。
  exposure:
    labels: [风格暴露, 候选风格暴露, 持仓暴露, 持仓与暴露, 持仓暴露与组合规模]
    short: 先核对暴露对象与分母，价量代理不等于完整风险模型。
    detail: 因子风格图是最新截面中因子与价量代理的秩相关，未自动进行行业、市值中性化。组合持仓暴露为持仓市值相对权益等指标，含义以当前图的轴、图例与结果说明为准。
  correlation:
    labels: [因子相关性, 相关性热力图]
    short: 接近1为同向，接近-1为反向，接近0表示线性关系较弱。
    detail: 因子热力图比较当前日期各因子在相同证券上的值；不是因子收益时间序列相关。行列为因子，颜色范围-1至1；缺少有效样本的格子留空。相关性不能解释为因果关系。
  relation:
    labels: [关联网络]
    short: 选择下方关系查看来源与原文证据；深度表示最多探索几跳。
    detail: 节点代表证券、行业、事件或任务，连线类型见图例。边宽有各自口径，不等于可信概率；相关性边正负需结合系数。新闻必须有实体匹配或来源证券标记。无真实证据时不补层级，模拟来源仅用于演示。可平移缩放，并使用适应全部按钮恢复视口。
  news:
    labels: [新闻词云, 新闻关键词, 新闻热词, 关键词云, 关键词强度]
    short: 词越突出表示在当前新闻样本中越常见，不代表投资价值。
    detail: 热词和主题来自所选新闻类别及当前样本。请结合原始文章、重复消息、发布时间和来源阅读，词频与情绪不等于公司基本面变化或交易信号。
  price:
    labels: [K线与成交量, K线, 行情K线, 价格与成交量, K 线]
    short: K线表示每期价格范围，成交量表示交易数量，两者单位不同。
    detail: 核对证券、日线或分钟周期以及复权方式。均线是历史价格平均值，不能单独证明未来走势。成交量不等于成交金额，停牌和缺失交易日可能造成间隔。
  score:
    labels: [多维评分, 综合评分, 个股评分, 股票评分, 候选评分对比, 推荐评分对比, 推荐评分分组, 评分分布, 因子对比]
    short: 评分用于同口径候选比较，不是盈利概率。
    detail: 分数来自当前策略或规则的映射，需结合评分维度、股票池和候选原因。不同模型、规则和日期的分数不可直接混比；具体依据与过程见推荐结果或执行证据。
  monthly:
    labels: [月度收益热力, 月度收益热力图]
    short: 每格是对应年月的期间收益，颜色表示正负与大小。
    detail: 按月汇总净值收益而非简单相加日收益；首尾月份可能不是完整月。对照回测区间、基准和费用，不能把个别高收益月份当作长期稳定性证明。
  rolling:
    labels: [滚动风险指标, 滚动指标, 滚动波动与夏普]
    short: 每个点只反映截至该日的滚动窗口，观察其随时间变化。
    detail: 核对滚动窗口和年化交易日数。窗口不足时应留空；夏普反映收益相对波动，不是盈利概率，不能与不同频率和成本口径直接比较。
  attribution:
    labels: [收益归因, 推荐回测归因, 绩效归因, 回测归因, 归因摘要]
    short: 柱或分组解释收益与费用的组成，先核对合计与分母。
    detail: 归因来自实际成交、持仓和费用明细，属于结果拆分；贡献较高不表示未来仍然有效。没有行业或基准分解的数据时，不应推断未提供的归因项。
  compare:
    labels: [回测对比, 候选回测对比, 回测比较, 参数对比图, 多组对比图]
    short: 只有股票池、日期、资金与费用等条件一致时才适合比较。
    detail: 同时查看收益、回撤、成交和执行限制。不同运行的参数与数据源保存在结果明细，不以单个最高收益结果代替完整检验。
  distribution:
    labels: [研报分布, 论文分布, 策略统计, 模型调用统计, 模型分布, 策略分布]
    short: 统计仅覆盖当前系统查询或保存的记录，不代表市场总体。
    detail: 横纵轴或扇区为类别与数量。请核对筛选条件、时间范围和样本数；缺少记录不代表对应市场事件没有发生。

help:
  cn_analysis: 读取时点内真实证据形成多维分析；不生成资金权重。
  cn_debate: 读取前级分析并进行多空交锋；缺必需资料不允许选择。评分不是收益概率。
  contest_data: 用已成熟成绩预测信息效用，在长度和去重约束下选择证据；冷启动明确标识。
  contest_research: 研究者预算由成熟影子成绩决定；所有效用非正或资料不足时留现金。只连接研究预算Portfolio。
  factor_score: 将当期有效因子转为同向排名并按等权或已到期历史ICIR合成；因子权重不是资金仓位。缺失不补零，权重上限不可行会明确阻断。
  factor: 因子面板按日期与证券对齐；依次预处理、使用已到期收益研究和去重，再合成为证券评分。中间面板不能直接用于资金分配。
  filter: 按当期可见数据保留候选；空结果不会自动扩大股票池。
  scorer: 输出连续评分；模型训练仍使用母池历史与已成熟标签，不能只用当日筛选结果训练。
  ensemble: 合并规则或评分。融合权重对应有序输入，预测期与语义由后端校验。
  agent: 仅终审有限候选并引用证据；历史回测默认关闭当期模型调用。
  portfolio: 将最终候选或子策略转为目标权重；评分权重与资金预算含义不同。
  risk: 对目标与实际持仓持续执行约束，风险削减后的余额保留现金。
  universe: 合法母池与截止时点由运行请求或资源池确定；模型历史不会因前级过滤丢失。
  execution: 前一收盘决策、下一可交易日开盘尝试成交，目标不等于实际持仓。

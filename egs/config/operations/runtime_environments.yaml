# File format: YAML; encoding: UTF-8
file_format: yaml
minimum_python: [3, 10, 1]
maximum_python_exclusive: [3, 15]
startup:
  mode: strict
  role: web
environments:
  web:
    directory: .venv-secure
    directory_env: ALL_IN_ONE_WEB_ENVIRONMENT
    directory_env: ALL_IN_ONE_WEB_ENVIRONMENT
    project_dependencies: true
    requirements: [egs/requirements/toolchain.txt]
  models:
    directory: .venv-secure
    directory_env: ALL_IN_ONE_WEB_ENVIRONMENT
    directory_env: ALL_IN_ONE_WEB_ENVIRONMENT
    project_dependencies: true
    requirements: [requirements-models.txt, egs/requirements/toolchain.txt]
  qlib:
    minimum_python: [3, 11]
    directory: .venv-qlib-secure
    directory_env: ALL_IN_ONE_QLIB_ENVIRONMENT
    directory_env: ALL_IN_ONE_QLIB_ENVIRONMENT
    project_dependencies: false
    requirements: [egs/requirements/qlib.txt, egs/requirements/toolchain.txt]
  image:
    minimum_python: [3, 11]
    directory: .venv-image-secure
    directory_env: ALL_IN_ONE_IMAGE_ENVIRONMENT
    directory_env: ALL_IN_ONE_IMAGE_ENVIRONMENT
    project_dependencies: false
    requirements: [egs/requirements/images.txt, egs/requirements/toolchain.txt]
